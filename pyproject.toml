[project]
name = "orbit-api"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.142.2",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.15.0",
    "sqlalchemy>=2.1.1",
    "uvicorn>=0.54.0",
]
description = "Add your description here."
authors = [{ name = "your-name", email = "your-email@example.com" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
]
readme = "README.md"

[project.scripts]
orbit-api = "orbit_api.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "actionlint-py>=1.7.12.25",
    "httpx2>=2.13.1",
    "mypy>=2.3.1",
    "prek>=0.5.4",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.16.0",
    "ruff>=0.16.9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/orbit_api"]

# ==================================================
# Tool Configuration
# ==================================================

# ---- Ruff ---- #

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = [
    "A",   # flake8-builtins
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "E",   # pycodestyle errors
    "F",   # Pyflakes
    "I",   # isort
    "RUF", # Ruff-specific
    "UP",  # pyupgrade
]
ignore = [
    "E501", # Line too long - handled automatically by `ruff format`
]
extend-select = ["SIM"]

# ---- Mypy ---- #

[tool.mypy]
mypy_path = "src"
python_version = "3.13"
pretty = true
show_error_codes = true
show_error_context = true
warn_return_any = true
warn_unused_configs = true
check_untyped_defs = true
explicit_package_bases = true
strict = true

# ---- Pytest ---- #

[tool.pytest.ini_options]
addopts = "--strict-markers"
testpaths = [
    "tests",
]
pythonpath = [
    ".",
]

[tool.coverage.run]
branch = true

[tool.coverage.report]
show_missing = true

# ---- Protostar ---- #

[tool.protostar]
version = 1
mode = "template"
python = "3.13"
ide = "none"
tier = "production"

[tool.protostar.source]
origin = "remote"
locator = "https://github.com/JacksonFergusonDev/protostar-example-templates"
path = "service"
ref = "v1.1.0"

[tool.protostar.fallback]
agents = false
ci = false
codecov = false
commitizen = false
community = false
direnv = false
docker = false
just = false
markdownlint = false
mypy = false
pre_commit = false
prek = false
pyrefly = false
pytest = false
readthedocs = false
release = false
renovate = false
ruff = true
rumdl = false
ty = false
zensical = false

[tool.protostar.context]
AUTHOR_NAME = "your-name"
CURRENT_YEAR = "2026"
PACKAGE_NAME = "orbit_api"
PROJECT_NAME = "orbit-api"
PYTHON_VERSION = "3.13"

[tool.protostar.metadata]
minimum_python = "3.13"
supported_os = ["MacOS", "Linux", "Windows"]

[tool.protostar.variables]
SERVICE_PORT = "8000"

[tool.protostar.options]
database = "postgres"
