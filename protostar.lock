[[files]]
path = ".github/workflows/ci.yml"
policy = "structured-yaml"
baseline = "jobs:\n  lint:\n    name: Lint & Type Check\n    runs-on: ubuntu-latest\n    steps:\n      - name: Checkout\n        uses: actions/checkout@v7\n      - name: Install uv\n        uses: astral-sh/setup-uv@v10.0.0\n        with:\n          enable-cache: true\n          python-version: '3.13'\n      - name: Install dependencies\n        run: uv sync --all-extras --dev --locked\n      - name: Run Ruff Linter\n        run: uv run ruff check --output-format=github .\n      - name: Run Ruff Formatter\n        run: uv run ruff format --check --output-format=github .\n      - name: Run Mypy\n        run: uv run mypy .\n      - name: Run actionlint\n        run: uv run actionlint\n  test:\n    name: Test on ${{ matrix.os }} with Python ${{ matrix.python-version }}\n    runs-on: ${{ matrix.os }}\n    steps:\n      - name: Checkout\n        uses: actions/checkout@v7\n      - name: Install uv\n        uses: astral-sh/setup-uv@v10.0.0\n        with:\n          enable-cache: true\n          python-version: ${{ matrix.python-version }}\n      - name: Install dependencies\n        run: \"uv sync --all-extras --dev --locked\\nuv pip install pytest-github-actions-annotate-failures\\n\"\n      - name: Run tests\n        run: uv run pytest\n    strategy:\n      matrix:\n        os:\n          - macos-latest\n          - ubuntu-latest\n          - windows-latest\n        python-version:\n          - '3.13'\n          - '3.14'\nname: CI\non:\n  pull_request:\n    branches:\n      - main\n  push:\n    branches:\n      - main\n"

[[files]]
path = ".pre-commit-config.yaml"
policy = "structured-yaml"
baseline = "default_install_hook_types:\n  - pre-commit\n  - pre-push\ndefault_stages:\n  - pre-commit\nrepos:\n  - hooks:\n      - exclude: ^uv\\.lock$\n        id: check-added-large-files\n      - id: check-merge-conflict\n      - id: check-case-conflict\n      - id: check-symlinks\n      - id: check-executables-have-shebangs\n      - exclude: \\.py$\n        id: trailing-whitespace\n      - exclude: \\.py$\n        id: end-of-file-fixer\n      - id: check-yaml\n      - id: check-json\n      - id: check-toml\n    repo: builtin\n  - hooks:\n      - entry: uv lock --check\n        files: ^(pyproject\\.toml|uv\\.lock)$\n        id: uv-lock-check\n        language: system\n        name: uv lock check\n        pass_filenames: false\n      - entry: uv run ruff check --fix\n        id: ruff-check\n        language: system\n        name: ruff check\n        require_serial: true\n        types:\n          - python\n      - entry: uv run ruff format\n        id: ruff-format\n        language: system\n        name: ruff format\n        require_serial: true\n        types:\n          - python\n      - entry: uv run mypy .\n        id: mypy\n        language: system\n        name: mypy\n        pass_filenames: false\n        types:\n          - python\n      - entry: uv run pytest\n        files: ^(src/|tests/|pyproject\\.toml|uv\\.lock)\n        id: pytest\n        language: system\n        name: pytest\n        pass_filenames: false\n        stages:\n          - pre-push\n      - entry: uv run actionlint\n        files: ^\\.github/workflows/.*\\.ya?ml$\n        id: actionlint\n        language: system\n        name: actionlint\n    repo: local\n  - hooks:\n      - id: gitleaks\n    repo: https://github.com/gitleaks/gitleaks\n    rev: v8.30.1\n"

